name: digital-asset

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: digital_asset_dev
      POSTGRES_USER: digital_asset
      POSTGRES_PASSWORD: digital_asset_dev
    ports:
      - "55432:5432"
    volumes:
      - digital_asset_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digital_asset -d digital_asset_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  digital_asset_postgres_data:
